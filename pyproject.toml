[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dictadesk"
version = "1.0.6"
description = "Desktop Dictation for Linux"
readme = "README.rst"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Erick Woods"}]
dependencies = ["sounddevice==0.5.6", "python-xlib==0.33", "keyring==25.7.0", "onnx-asr[cpu,hub]==0.12.0", "moonshine-voice==0.1.5"]

[project.scripts]
dictadesk = "dictadesk.ui.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dictadesk = ["resources/*"]

[tool.ruff]
line-length = 96

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
